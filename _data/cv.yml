- title: research interests
  type: map
  contents:
    - name: Computational Design for Climate Technology
      value: Existential challenges require our sharpest tools. I drive the automatic production of solutions to challenging mechanical design problems, specifically in nonlinear design spaces where human intuition struggles. Core contributions include compact and flexible design representations, accelerated numerical models of physical phenomena, and synthesis of design, simulation, and fabrication processes.
    - name: Electrostatic Transduction
      value: Soft liquid-solid dielectric systems for harvesting the energy in ocean waves.
    - name: Additive Manufacturing
      value: Squeezing the capabilities of cutting edge additive manufacturing technologies to create multiphase, multimaterial, multiscale complex artifacts.

- title: work history
  type: time_table
  contents:
    - title: Postdoctoral Researcher
      institution: Max Planck Institute for Intelligent Systems
      department: Robotic Materials Department, supervised by Christoph Keplinger
      year: 2024 – 2027
      location: Stuttgart, DE
      description:
        - Awarded the Alexander von Humboldt Postdoctoral Fellowship for research into harvesting ocean wave energy using electrostatics
        - Publication of electrostatic energy generator units with field-leading performance, <em>Advanced Science</em>
        - Led simulation efforts in investigation of vibrotactile sensing in functionally graded whiskers, <em>Science</em>

    - title: Doctoral Candidate & Researcher
      institution: University of Colorado, Boulder
      department: Supervised by Robert MacCurdy; dissertation on computational design and fabrication of soft structures
      year: 2018 – 2023
      location: Boulder, CO
      description:
        - Award winning conference proceeding and subsequent IEEE journal publication presenting open-source toolkit for seamless design, simulation, and fabrication of pneumatic soft actuators
        - Designed tunable energy-absorbing metamaterials which transmit 6x lower forces and operate over 10x wider energy bandwidth for personal safety and shipping applications

    - title: Independent Contractor, Engineering Design and Analysis
      institution: FPrin, LLC
      department: Client-facing expert in numerical modeling for first-principles-based design and analysis
      year: 2018 – 2024
      location: Remote
      description:
        - Executed and communicated finite element analysis to international medical device client, resulting in retooling of a 16 cavity production mold currently running at 10M units/month volume
        - Developed novel phase transformation model for shape memory alloys used in insulin pumps (sales >1M units/month); worked directly with Mathworks developers to implement the model

    - title: Mechanical Engineer Lv.1, Lv.2
      institution: Triple Ring Technologies
      department: Numerical modeling, mechanical design, data analysis, fixture design and validation, and client communication across 20 projects in 3 years
      year: 2014 – 2017
      location: Newark, CA
      description:
        - Led blank-slate design and fabrication of a novel bolus delivery mechanism for a miniature wearable insulin delivery device
        - Implemented feedback controller regulating optical sensor temperature to ±1°C in a 510(k) approved oximetry device
        - Developed core competency in numerical simulation of multiphysics problems (heat transfer, fluid flow, continuum mechanics); delivered two invited technical presentations for COMSOL Inc.

